[project]
name = "mini-gpt-from-scratch"
version = "0.1.0"
description = "Educational GPT implementation from scratch using PyTorch"
readme = "README.md"
authors = [
    { name = "Egor", email = "emrybalko@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "minigpt"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]